name: CI
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.0.0
      - uses: actions/setup-node@v4.0.2
        with:
          node-version: 22.11.0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - name: Install WP-CLI
        run: docker pull wp-cli/wp-cli:2.10.0
