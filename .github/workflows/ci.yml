name: CI

# Lints and tests every pull request and every push to main.
#
# Until this workflow existed nothing ran the suites on a PR, while every merge to
# main is split straight onto the npm/* branches that consumers install from, so a
# broken merge reached new installs with no gate in between.
#
# Node: every npm workspace's lint + Jest suite with coverage (each workspace's
# jest.config.js holds its own coverageThreshold), on the engines floor and the
# current LTS.
#
# PHP: each composer-packages/* package is installed and tested standalone, the
# way it ships after the subtree split, on the consumer floor (8.2) and newer.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.19 is the engines floor of every package; 24 is the current LTS.
        node: ["22.19", "24"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install workspaces
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

  php:
    name: PHP ${{ matrix.php }} / wp-${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
        package: [phpcs, phpstan]
    defaults:
      run:
        working-directory: composer-packages/${{ matrix.package }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Install the package standalone
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Test
        run: composer test
